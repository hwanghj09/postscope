name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      collect:
        description: Fetch Telegram records before publishing
        type: boolean
        default: false
  schedule:
    - cron: '5 0 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  collect:
    name: Update daily data
    if: github.event_name == 'schedule' || inputs.collect == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.23'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: Collect once and generate public data
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: uv run --no-sync python scripts/collect_daily.py
      - name: Keep the last successful public snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/dataset.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily posting snapshot'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  build:
    name: Build and test website
    needs: collect
    if: always() && (needs.collect.result == 'success' || needs.collect.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.23'
          python-version: '3.12'
          enable-cache: true
      - name: Install locked dependencies
        run: |
          uv sync --frozen
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Build browser app and bundled analysis engine
        run: uv run python scripts/build_web.py
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Test website without an API server
        run: uv run pytest -q tests/test_web_browser.py
      - name: Upload website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web-dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Use the Actions deployment source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow > /dev/null
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
